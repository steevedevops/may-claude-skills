<!doctype html>
<!--
  Quadro de um print. Copie como iOS-k.dc.html / Play-k.dc.html / iPad-k.dc.html.

-->

<title>iOS-1</title>

body{margin:0}
</style>

<div style="width: 430px; height: 932px; overflow: hidden">
<dc-import name="Main" platform="ios" slide="0" hint-size="430px,932px"></dc-import>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":430,"height":932}}'>

</html>
